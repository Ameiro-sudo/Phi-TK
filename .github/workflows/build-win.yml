name: Phi-TK noise build (Windows only)

on:
  workflow_dispatch:
  push:
    branches:
      - 'noise-build'

concurrency:
  group: windows-noise-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Rust setup
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable-x86_64-gnu

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          cache-all-crates: "true"

      - name: Sync node version and setup cache
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.3

      - name: Install frontend dependencies
        run: pnpm install

      - name: Extract in-tree static-lib
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path static-lib | Out-Null
          tar -xf prpr-avc-static-lib.tar.gz -C static-lib
          Get-ChildItem -Recurse static-lib | Select-Object -First 20 FullName, Length

      - name: Build the app
        uses: tauri-apps/tauri-action@v0
        with:
          args: --bundles msi --bundles nsis
        env:
          PRPR_AVC_LIBS: ${{ github.workspace }}/static-lib

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: phitk-noise-win
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe

      - name: Upload raw exe + logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phitk-noise-raw
          if-no-files-found: ignore
          path: |
            src-tauri/target/release/*.exe
            src-tauri/target/release/bundle/nsis/**/*.log
